# ═══════════════════════════════════════════════════════
# docker-compose.yml — CareerPilot AI Development Stack
#
# Services:
#   postgres  — PostgreSQL 16 database
#   backend   — FastAPI application (hot reload)
#   frontend  — React/Vite dev server (hot reload)
#
# Usage:
#   docker compose up --build
#   docker compose down -v   (also removes the DB volume)
# ═══════════════════════════════════════════════════════

services:

  # ──────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: careerpilot_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      # Expose on host so you can connect via pgAdmin or DBeaver locally
      - "5432:5432"

    volumes:
      # Named volume — persists database data between docker compose down/up
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # Readiness probe — the backend service waits until this passes
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-careerpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - careerpilot_network

  # ──────────────────────────────────────────
  # FastAPI Backend (Development — hot reload)
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Use the builder stage only in development for hot reload
      target: builder
    container_name: careerpilot_backend
    restart: unless-stopped

    # Override the production CMD — use uvicorn with hot reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    environment:
      # These can be overridden in a .env file at the project root
      APP_NAME: "CareerPilot AI"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-careerpilot}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

    ports:
      - "8000:8000"

    volumes:
      # Mount source code into container for hot reload
      - ./backend:/app

    depends_on:
      postgres:
        # Do not start until postgres health check passes
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - careerpilot_network

  # ──────────────────────────────────────────
  # React + Vite Frontend (Development — hot reload via HMR)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Use the builder stage only in development
      target: builder
    container_name: careerpilot_frontend
    restart: unless-stopped

    # Override: run Vite dev server instead of the nginx prod server
    command: npm run dev -- --host 0.0.0.0 --port 5173

    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}

    ports:
      - "5173:5173"

    volumes:
      # Mount source for Vite HMR hot reload
      - ./frontend:/app
      # Prevent host node_modules from overwriting container node_modules
      - /app/node_modules

    depends_on:
      - backend

    networks:
      - careerpilot_network

# ──────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────
volumes:
  postgres_data:
    # Named volume — data survives container recreation
    driver: local

# ──────────────────────────────────────────
# Networks
# ──────────────────────────────────────────
networks:
  careerpilot_network:
    # Custom bridge network — containers communicate by service name
    driver: bridge
